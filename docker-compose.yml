version: '3.8'

services:
  db:
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  web:
    build: .
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: .
    volumes:
    environment:
    depends_on:
      - redis

    volumes:
    depends_on:

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: