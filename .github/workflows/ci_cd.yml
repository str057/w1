name: Django CI/CD

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate migrations
      run: |
        python manage.py makemigrations --check --dry-run

    - name: Run migrations and test
      env:
        SECRET_KEY: test-secret-key-for-ci-cd-${{ github.run_id }}
        DEBUG: True
        ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        DB_ENGINE: django.db.backends.postgresql
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_RESULT_BACKEND: redis://localhost:6379/0
      run: |
        python manage.py migrate
        python manage.py test

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
    - name: Deploy to Staging Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USERNAME }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          cd /home/django/mailing_service
          git pull origin dev
          source venv/bin/activate
          pip install -r requirements.txt
          # Бэкап с правильной кодировкой
          PYTHONIOENCODING=utf-8 python manage.py dumpdata --format=json --indent=2 > /tmp/backup_$(date +%Y%m%d_%H%M%S).json
          python manage.py migrate --no-input
          python manage.py collectstatic --noinput
          sudo systemctl restart gunicorn
          sudo systemctl restart celery

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Deploy to Production Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USERNAME }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        script: |
          cd /home/django/mailing_service
          git pull origin main
          source venv/bin/activate
          pip install -r requirements.txt
          # Бэкап с правильной кодировкой
          PYTHONIOENCODING=utf-8 python manage.py dumpdata --format=json --indent=2 > /tmp/backup_$(date +%Y%m%d_%H%M%S).json
          python manage.py migrate --no-input
          python manage.py collectstatic --noinput
          sudo systemctl restart gunicorn
          sudo systemctl restart celery
          
          